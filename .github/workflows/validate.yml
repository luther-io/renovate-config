name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate preset
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global default.json

      - name: Validate repo config
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global renovate.json
